<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Animation Panoramas</title>
  <style>
    :root {
      --seed: #1B5C2A;
      --bg: #DCE5D9;
      --surface: #E3EBE0;
      --surface-high: #CFDACB;
      --on-surface: #141F16;
      --on-surface-variant: #3E4D40;
      --border: rgba(27, 92, 42, 0.22);
      --primary: #1B5C2A;
      --on-primary: #FFFFFF;
      --scrim: rgba(255, 255, 255, 0.15);
      --gif-opacity: 0.28;
    }

    html[data-theme="dark"] {
      --bg: #0F1711;
      --surface: #17231A;
      --surface-high: #213125;
      --on-surface: #E4EDE6;
      --on-surface-variant: #AFC0B3;
      --border: rgba(163, 214, 173, 0.22);
      --primary: #57B86C;
      --on-primary: #06210C;
      --scrim: rgba(0, 0, 0, 0.35);
      --gif-opacity: 0.32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg);
      color: var(--on-surface);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .bg-gif {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
      opacity: var(--gif-opacity);
      transition: opacity 0.25s ease;
    }

    .bg-scrim {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-color: var(--scrim);
      transition: background-color 0.25s ease;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background-color: color-mix(in srgb, var(--surface) 90%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }

    .brand {
      font-weight: 700;
      font-size: 1rem;
      color: var(--on-surface);
      text-decoration: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .seg-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background-color: var(--surface-high);
    }

    .seg-btn {
      border: 0;
      background: transparent;
      color: var(--on-surface);
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .seg-btn.active {
      background-color: var(--primary);
      color: var(--on-primary);
      font-weight: 600;
    }

    select {
      background-color: var(--surface-high);
      color: var(--on-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    main {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 28px 24px;
      border-radius: 16px;
      background-color: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .code {
      margin: 0;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.1;
      color: var(--primary);
    }

    h1 {
      margin: 10px 0 8px;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 20px;
      color: var(--on-surface-variant);
      line-height: 1.5;
    }

    .home-link {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background-color: var(--primary);
      color: var(--on-primary);
      text-decoration: none;
      font-weight: 600;
    }

    footer {
      flex-shrink: 0;
      padding: 12px 20px;
      background-color: color-mix(in srgb, var(--surface) 90%, transparent);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(6px);
      color: var(--on-surface-variant);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <img id="bgGif" class="bg-gif" src="/assets/assets/gifs/bg.gif" alt="" aria-hidden="true" />
  <div class="bg-scrim" aria-hidden="true"></div>

  <header>
    <a class="brand" href="/" id="brandTitle">Animation Panoramas</a>
    <div class="controls">
      <div class="seg-group" role="group" aria-label="Theme mode">
        <button type="button" class="seg-btn" data-mode="auto" id="btnAuto">Auto</button>
        <button type="button" class="seg-btn" data-mode="day" id="btnDay">Day</button>
        <button type="button" class="seg-btn" data-mode="night" id="btnNight">Night</button>
      </div>
      <select id="langSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ar">العربية</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="code">404</div>
      <h1 id="pageTitle">Page not found</h1>
      <p id="pageDesc">The page you requested does not exist or has moved.</p>
      <a class="home-link" href="/" id="homeBtn">Go Home</a>
    </div>
  </main>

  <footer id="footerText">© 2026 Animation Panoramas</footer>

  <script>
    (function () {
      const THEME_KEY = "ap_theme_mode";
      const LANG_KEY = "ap_lang";
      const SUNRISE_HOUR = 6;
      const SUNSET_HOUR = 18;
      const DAY_GIF = "/assets/assets/gifs/bg.gif";
      const NIGHT_GIF = "/assets/assets/gifs/bg_ev.gif";

      const translations = {
        en: {
          brand: "Animation Panoramas",
          title: "Page not found",
          desc: "The page you requested does not exist or has moved.",
          home: "Go Home",
          auto: "Auto",
          day: "Day",
          night: "Night",
          footer: "© 2026 Animation Panoramas",
          dir: "ltr"
        },
        es: {
          brand: "Animation Panoramas",
          title: "Página no encontrada",
          desc: "La página solicitada no existe o se ha movido.",
          home: "Ir al inicio",
          auto: "Auto",
          day: "Día",
          night: "Noche",
          footer: "© 2026 Animation Panoramas",
          dir: "ltr"
        },
        fr: {
          brand: "Animation Panoramas",
          title: "Page introuvable",
          desc: "La page demandée n'existe pas ou a été déplacée.",
          home: "Accueil",
          auto: "Auto",
          day: "Jour",
          night: "Nuit",
          footer: "© 2026 Animation Panoramas",
          dir: "ltr"
        },
        de: {
          brand: "Animation Panoramas",
          title: "Seite nicht gefunden",
          desc: "Die angeforderte Seite existiert nicht oder wurde verschoben.",
          home: "Startseite",
          auto: "Auto",
          day: "Tag",
          night: "Nacht",
          footer: "© 2026 Animation Panoramas",
          dir: "ltr"
        },
        ar: {
          brand: "Animation Panoramas",
          title: "الصفحة غير موجودة",
          desc: "الصفحة التي طلبتها غير موجودة أو تم نقلها.",
          home: "الصفحة الرئيسية",
          auto: "تلقائي",
          day: "نهار",
          night: "ليل",
          footer: "© 2026 Animation Panoramas",
          dir: "rtl"
        },
        hi: {
          brand: "Animation Panoramas",
          title: "पृष्ठ नहीं मिला",
          desc: "आपके द्वारा अनुरोधित पृष्ठ मौजूद नहीं है या स्थानांतरित कर दिया गया है।",
          home: "होम पर जाएं",
          auto: "ऑटो",
          day: "दिन",
          night: "रात",
          footer: "© 2026 Animation Panoramas",
          dir: "ltr"
        }
      };

      function isDaytime(now = new Date(), { sunriseHour = SUNRISE_HOUR, sunsetHour = SUNSET_HOUR } = {}) {
        const h = now.getHours();
        return h >= sunriseHour && h < sunsetHour;
      }

      function resolveEffectiveTheme(mode, now = new Date()) {
        if (mode === "day") return "light";
        if (mode === "night") return "dark";
        return isDaytime(now) ? "light" : "dark";
      }

      function applyThemeMode(mode) {
        localStorage.setItem(THEME_KEY, mode);
        const effective = resolveEffectiveTheme(mode, new Date());
        const isDay = effective === "light";

        document.documentElement.setAttribute("data-theme", effective);

        const bgGif = document.getElementById("bgGif");
        if (bgGif) {
          const targetSrc = isDay ? DAY_GIF : NIGHT_GIF;
          if (!bgGif.getAttribute("src")?.endsWith(targetSrc)) {
            bgGif.setAttribute("src", targetSrc);
          }
        }

        document.querySelectorAll(".seg-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === mode);
        });
      }

      function applyLanguage(lang) {
        const entry = translations[lang] ? lang : "en";
        const t = translations[entry];
        localStorage.setItem(LANG_KEY, entry);
        document.documentElement.lang = entry;
        document.documentElement.dir = t.dir;

        document.title = `404 · ${t.brand}`;
        document.getElementById("brandTitle").textContent = t.brand;
        document.getElementById("pageTitle").textContent = t.title;
        document.getElementById("pageDesc").textContent = t.desc;
        document.getElementById("homeBtn").textContent = t.home;
        document.getElementById("btnAuto").textContent = t.auto;
        document.getElementById("btnDay").textContent = t.day;
        document.getElementById("btnNight").textContent = t.night;
        document.getElementById("footerText").textContent = t.footer;
        document.getElementById("langSelect").value = entry;
      }

      function recheckAutoDayNight() {
        const currentMode = localStorage.getItem(THEME_KEY) || "auto";
        if (currentMode === "auto") {
          applyThemeMode("auto");
        }
      }

      function startAutoDayNightWatcher() {
        const now = new Date();
        const msUntilNextMinute =
          (60 - now.getSeconds()) * 1000 - now.getMilliseconds();

        setTimeout(() => {
          recheckAutoDayNight();
          setInterval(recheckAutoDayNight, 60000);
        }, Math.max(0, msUntilNextMinute));
      }

      document.querySelectorAll(".seg-btn").forEach((btn) => {
        btn.addEventListener("click", () => applyThemeMode(btn.dataset.mode));
      });

      document.getElementById("langSelect").addEventListener("change", (e) => {
        applyLanguage(e.target.value);
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          recheckAutoDayNight();
        }
      });

      window.addEventListener("focus", recheckAutoDayNight);

      const savedMode = localStorage.getItem(THEME_KEY) || "auto";
      const savedLang = localStorage.getItem(LANG_KEY) || "en";

      applyLanguage(savedLang);
      applyThemeMode(savedMode);
      startAutoDayNightWatcher();
    })();
  </script>
</body>
</html>
